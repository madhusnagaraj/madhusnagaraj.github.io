name: Refresh project screenshots

on:
  schedule:
    - cron: "41 14 * * 1"   # weekly, Mondays 14:41 UTC
  push:
    paths: ["data/projects.json"]   # a new or changed project gets its screenshot right away
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh            # never runs at the same time as the daily data refresh
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retake screenshots with headless Chrome
        id: shots
        run: |
          status=0
          python3 scripts/project_shots.py || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Commit whatever changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh project screenshots"
            git pull --rebase
            git push
          fi
      - name: Fail loudly if a capture broke (GitHub emails you)
        if: steps.shots.outputs.status != '0'
        run: |
          echo "::error::A project screenshot failed; the old one was kept."
          exit 1
