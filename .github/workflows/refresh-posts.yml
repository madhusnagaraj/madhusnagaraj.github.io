name: Refresh site data

on:
  schedule:
    - cron: "17 14 * * *"   # daily, 14:17 UTC
  push:
    paths: ["prompts/**"]    # a new or edited prompt shows up right away
  workflow_dispatch:         # "Run workflow" button for an immediate refresh

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild data from Substack, GitHub and prompts/
        id: refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          python3 scripts/refresh.py || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Commit whatever did refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/covers
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh site data"
            git push
          fi
      - name: Fail loudly if a source broke (GitHub emails you)
        if: steps.refresh.outputs.status != '0'
        run: |
          echo "::error::A refresh source failed; the site kept its previous data. See the step above."
          exit 1
